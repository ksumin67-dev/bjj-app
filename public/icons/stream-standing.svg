<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Left wrestler -->
  <g fill="#FBBF24">
    <!-- Head -->
    <circle cx="20" cy="13" r="9"/>
    <!-- Torso leaning right toward center -->
    <rect x="12" y="21" width="26" height="14" rx="7" transform="rotate(28 25 28)"/>
    <!-- Outer arm going down-left -->
    <rect x="3" y="28" width="20" height="11" rx="5.5" transform="rotate(-28 13 33)"/>
    <!-- Inner arm reaching toward center -->
    <rect x="27" y="36" width="28" height="11" rx="5.5" transform="rotate(-6 41 41)"/>
    <!-- Outer leg -->
    <rect x="3" y="49" width="22" height="11" rx="5.5" transform="rotate(-22 14 54)"/>
    <!-- Inner leg -->
    <rect x="20" y="49" width="22" height="11" rx="5.5" transform="rotate(14 31 54)"/>
  </g>
  <!-- Right wrestler (mirrored) -->
  <g fill="#FBBF24" transform="translate(100,0) scale(-1,1)">
    <circle cx="20" cy="13" r="9"/>
    <rect x="12" y="21" width="26" height="14" rx="7" transform="rotate(28 25 28)"/>
    <rect x="3" y="28" width="20" height="11" rx="5.5" transform="rotate(-28 13 33)"/>
    <rect x="27" y="36" width="28" height="11" rx="5.5" transform="rotate(-6 41 41)"/>
    <rect x="3" y="49" width="22" height="11" rx="5.5" transform="rotate(-22 14 54)"/>
    <rect x="20" y="49" width="22" height="11" rx="5.5" transform="rotate(14 31 54)"/>
  </g>
</svg>
