<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sword 1: rotated -45° → tip to upper-left, pommel to lower-right -->
  <g transform="rotate(-45 50 50)">
    <!-- Blade: tapered triangle, tip at top -->
    <polygon points="50,7 45,46 55,46" fill="#FF8C42"/>
    <!-- Crossguard: wide horizontal bar -->
    <rect x="27" y="45" width="46" height="7" rx="3.5" fill="#FF8C42"/>
    <!-- Handle/Grip -->
    <rect x="46.5" y="52" width="7" height="20" rx="3.5" fill="#FF8C42"/>
    <!-- Pommel: round ball -->
    <circle cx="50" cy="77" r="6" fill="#FF8C42"/>
  </g>
  <!-- Sword 2: rotated +45° → tip to upper-right, pommel to lower-left -->
  <g transform="rotate(45 50 50)">
    <polygon points="50,7 45,46 55,46" fill="#FF8C42"/>
    <rect x="27" y="45" width="46" height="7" rx="3.5" fill="#FF8C42"/>
    <rect x="46.5" y="52" width="7" height="20" rx="3.5" fill="#FF8C42"/>
    <circle cx="50" cy="77" r="6" fill="#FF8C42"/>
  </g>
</svg>
