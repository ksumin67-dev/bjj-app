apply plugin: 'com.android.application'

// 버전과 업로드 키 해석. 절차·변수 이름은 docs/android_play_signing.md
def blankToNull = { value ->
    if (value == null) {
        return null
    }
    def text = value.toString().trim()
    return text ? text : null
}

def grapplelogVersionName = blankToNull(System.getenv('ANDROID_VERSION_NAME'))
def grapplelogVersionNameSource = 'env ANDROID_VERSION_NAME'
if (grapplelogVersionName == null) {
    grapplelogVersionName = blankToNull(findProperty('ANDROID_VERSION_NAME'))
    grapplelogVersionNameSource = 'gradle property ANDROID_VERSION_NAME'
}
if (grapplelogVersionName == null) {
    grapplelogVersionName = blankToNull(findProperty('versionName'))
    grapplelogVersionNameSource = 'gradle property versionName'
}
if (grapplelogVersionName == null) {
    grapplelogVersionName = '1.0.0'
    grapplelogVersionNameSource = 'default'
}

def explicitVersionCode = blankToNull(System.getenv('ANDROID_VERSION_CODE'))
def grapplelogVersionCodeSource = 'env ANDROID_VERSION_CODE'
if (explicitVersionCode == null) {
    explicitVersionCode = blankToNull(findProperty('ANDROID_VERSION_CODE'))
    grapplelogVersionCodeSource = 'gradle property ANDROID_VERSION_CODE'
}
if (explicitVersionCode == null) {
    explicitVersionCode = blankToNull(findProperty('versionCode'))
    grapplelogVersionCodeSource = 'gradle property versionCode'
}

int grapplelogVersionCode
if (explicitVersionCode != null) {
    if (!(explicitVersionCode ==~ /^[1-9][0-9]*$/)) {
        throw new GradleException("ANDROID_VERSION_CODE / versionCode 는 1 이상의 정수여야 합니다. 받은 값: ${explicitVersionCode}")
    }
    def parsed = new BigInteger(explicitVersionCode)
    if (parsed > 2100000000G) {
        throw new GradleException("versionCode ${explicitVersionCode} 가 Play 최대값 2100000000 을 넘습니다.")
    }
    grapplelogVersionCode = parsed.intValue()
} else {
    def semver = (grapplelogVersionName =~ /^(\d+)\.(\d+)(?:\.(\d+))?$/)
    if (semver.matches()) {
        def major = new BigInteger(semver[0][1])
        def minor = new BigInteger(semver[0][2])
        def patch = semver[0][3] != null ? new BigInteger(semver[0][3]) : BigInteger.ZERO
        if (minor > 99G || patch > 99G) {
            throw new GradleException("versionName '${grapplelogVersionName}' 의 minor/patch 는 99 이하여야 자동 versionCode(MAJOR*10000+MINOR*100+PATCH)를 쓸 수 있습니다. ANDROID_VERSION_CODE 를 지정하세요.")
        }
        def derived = major * 10000G + minor * 100G + patch
        if (derived < 1G || derived > 2100000000G) {
            throw new GradleException("versionName '${grapplelogVersionName}' 에서 계산한 versionCode ${derived} 가 Play 허용 범위(1..2100000000) 밖입니다. ANDROID_VERSION_CODE 를 지정하세요.")
        }
        grapplelogVersionCode = derived.intValue()
        grapplelogVersionCodeSource = "versionName ${grapplelogVersionName} → MAJOR*10000+MINOR*100+PATCH"
    } else {
        grapplelogVersionCode = 1
        grapplelogVersionCodeSource = 'fallback 1 (versionName 이 MAJOR.MINOR[.PATCH] 가 아님)'
        logger.warn("[그래플로그] versionName '${grapplelogVersionName}' 형식에서 versionCode 를 계산하지 못해 1 을 사용합니다. 릴리스 전 ANDROID_VERSION_CODE 를 지정하세요.")
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystorePropertiesLoadError = null
if (keystorePropertiesFile.exists()) {
    try {
        keystorePropertiesFile.withReader('UTF-8') { reader ->
            keystoreProperties.load(reader)
        }
    } catch (Exception e) {
        keystorePropertiesLoadError = e.message ?: e.toString()
    }
}

def signingValue = { String envName, String propName ->
    def fromEnv = blankToNull(System.getenv(envName))
    if (fromEnv != null) {
        return fromEnv
    }
    if (keystorePropertiesLoadError != null) {
        return null
    }
    return blankToNull(keystoreProperties.getProperty(propName))
}

def signingStoreRaw = signingValue('ANDROID_UPLOAD_STORE_FILE', 'storeFile')
def signingStorePassword = signingValue('ANDROID_UPLOAD_STORE_PASSWORD', 'storePassword')
def signingKeyAlias = signingValue('ANDROID_UPLOAD_KEY_ALIAS', 'keyAlias')
def signingKeyPassword = signingValue('ANDROID_UPLOAD_KEY_PASSWORD', 'keyPassword')

def missingSigningFields = []
if (signingStoreRaw == null) missingSigningFields << 'storeFile (ANDROID_UPLOAD_STORE_FILE)'
if (signingStorePassword == null) missingSigningFields << 'storePassword (ANDROID_UPLOAD_STORE_PASSWORD)'
if (signingKeyAlias == null) missingSigningFields << 'keyAlias (ANDROID_UPLOAD_KEY_ALIAS)'
if (signingKeyPassword == null) missingSigningFields << 'keyPassword (ANDROID_UPLOAD_KEY_PASSWORD)'

def expandUserHome = { String raw ->
    if (raw == '~') {
        return System.getProperty('user.home')
    }
    if (raw.startsWith('~/') || raw.startsWith('~\\')) {
        return System.getProperty('user.home') + raw.substring(1)
    }
    return raw
}

File signingStoreFile = null
if (signingStoreRaw != null) {
    def expanded = expandUserHome(signingStoreRaw)
    def asFile = new File(expanded)
    signingStoreFile = asFile.isAbsolute() ? asFile : new File(rootProject.projectDir, expanded)
}

def releaseSigningReady = missingSigningFields.isEmpty() && signingStoreFile != null && signingStoreFile.isFile()

def releaseSigningLines = []
releaseSigningLines << '[그래플로그] 릴리스 서명 정보가 없습니다. assembleDebug 는 키 없이 동작합니다.'
releaseSigningLines << 'assembleRelease / bundleRelease / packageRelease / installRelease 는 업로드 키가 없으면 중단합니다.'
if (keystorePropertiesLoadError != null && !missingSigningFields.isEmpty()) {
    releaseSigningLines << "android/keystore.properties 를 읽지 못했습니다: ${keystorePropertiesLoadError}"
}
if (!missingSigningFields.isEmpty()) {
    releaseSigningLines << "비어 있는 항목: ${missingSigningFields.join(', ')}"
    releaseSigningLines << '값은 환경변수 또는 gitignore 된 android/keystore.properties 에서만 읽습니다. 같은 항목은 환경변수가 우선합니다.'
    releaseSigningLines << '비밀번호는 로그에 출력하지 않습니다.'
} else if (signingStoreFile != null && !signingStoreFile.isFile()) {
    releaseSigningLines << "키스토어 파일을 찾지 못했습니다: ${signingStoreFile.absolutePath}"
    releaseSigningLines << '저장소 밖에서 만든 업로드 키의 절대 경로를 지정하세요.'
}
releaseSigningLines << '절차: docs/android_play_signing.md'
def releaseSigningMessage = releaseSigningLines.join('\n')

logger.lifecycle("[그래플로그] versionName=${grapplelogVersionName} (${grapplelogVersionNameSource}), versionCode=${grapplelogVersionCode} (${grapplelogVersionCodeSource}), releaseSigning=${releaseSigningReady ? 'ready' : 'missing'}")
if (keystorePropertiesLoadError != null && releaseSigningReady) {
    logger.warn("[그래플로그] android/keystore.properties 를 읽지 못했지만 환경변수로 서명이 준비되었습니다: ${keystorePropertiesLoadError}")
}
if (!releaseSigningReady) {
    logger.warn(releaseSigningMessage)
}

def isReleasePackagingTaskName = { String name ->
    name ==~ /^(assemble|bundle|package|install)Release$/ ||
        name == 'signReleaseBundle' ||
        name == 'packageReleaseBundle'
}

gradle.taskGraph.whenReady { graph ->
    if (releaseSigningReady) {
        return
    }
    def hit = graph.allTasks.find { task ->
        task.project == project && isReleasePackagingTaskName(task.name)
    }
    if (hit != null) {
        throw new GradleException(releaseSigningMessage)
    }
}

afterEvaluate {
    tasks.configureEach { task ->
        if (isReleasePackagingTaskName(task.name)) {
            task.doFirst {
                if (!releaseSigningReady) {
                    throw new GradleException(releaseSigningMessage)
                }
            }
        }
    }
}

android {
    namespace "com.aqua.bjjapp"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aqua.bjjapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode grapplelogVersionCode
        versionName grapplelogVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (releaseSigningReady) {
        signingConfigs {
            release {
                storeFile signingStoreFile
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            // Capacitor 플러그인 keep 규칙이 비어 있어 R8은 검증 전 켜지 않는다.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
